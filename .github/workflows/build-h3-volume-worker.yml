name: Build H3 volume worker image

on:
  push:
    branches: [main]
    paths:
      - "h3-volume-worker/**"
      - ".github/workflows/build-h3-volume-worker.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space (the CUDA base image is ~10 GB)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: h3-volume-worker
          push: true
          tags: |
            ghcr.io/chappy0210/h3-volume-worker:v1
