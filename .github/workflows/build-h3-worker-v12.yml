name: Build H3 cache worker v12 image

# NOTE: this file currently lives in h3-worker-v12/ for review. To deploy,
# it must be placed at the repo root: .github/workflows/build-h3-worker-v12.yml
# (GitHub Actions only runs workflows from that directory).

on:
  push:
    branches: [main]
    paths:
      - "h3-worker-v12/**"
      - ".github/workflows/build-h3-worker-v12.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space (the CUDA base image is ~10 GB)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: h3-worker-v12
          push: true
          tags: |
            ghcr.io/chappy0210/h3-cache-worker:v12
