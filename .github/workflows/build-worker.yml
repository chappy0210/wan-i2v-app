name: Build Wan I2V Worker (GHCR)

# Phone-friendly build route: no local PC and no local Docker needed.
# Push this repository to GitHub and GitHub Actions builds the worker
# image and publishes it to GHCR as:
#   ghcr.io/<github-owner-lowercase>/wan-i2v-worker:latest
# Use that exact image name in the RunPod Serverless endpoint.
#
# The repository root must be the wan-i2v-app folder itself, so that
# runpod-worker/Dockerfile sits at <repo>/runpod-worker/Dockerfile.

on:
  push:
    branches: [main]
    paths:
      - "runpod-worker/**"
      - ".github/workflows/build-worker.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Compute the lowercase GHCR image name
        id: image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/wan-i2v-worker" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the worker image
        uses: docker/build-push-action@v6
        with:
          context: runpod-worker
          file: runpod-worker/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
